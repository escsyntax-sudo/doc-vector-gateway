name: doc-vector-gateway

services:
  extractor:
    build:
      context: ./py-service
      args:
        INSTALL_ML: ${INSTALL_ML:-false}
    environment:
      DOC_ENV: production
      DOC_INTERNAL_TOKEN: ${DOC_INTERNAL_TOKEN:?set DOC_INTERNAL_TOKEN}
      DOC_EMBEDDING_BACKEND: ${DOC_EMBEDDING_BACKEND:-auto}
      DOC_EMBEDDING_MODEL: ${DOC_EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      DOC_CHUNK_SIZE: ${DOC_CHUNK_SIZE:-1200}
      DOC_CHUNK_OVERLAP: ${DOC_CHUNK_OVERLAP:-200}
      DOC_MAX_UPLOAD_BYTES: ${DOC_MAX_UPLOAD_BYTES:-20971520}
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,urllib.request; req=urllib.request.Request('http://127.0.0.1:8000/health', headers={'x-internal-token': os.environ['DOC_INTERNAL_TOKEN']}); urllib.request.urlopen(req, timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  gateway:
    build:
      context: ./node-orchestrator
    depends_on:
      extractor:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "8080"
      HOST: 0.0.0.0
      DOC_DATA_DIR: /app/data
      DOC_DB_PATH: /app/data/doc-vectors.db
      DOC_EXTRACTOR_URL: http://extractor:8000
      DOC_INTERNAL_TOKEN: ${DOC_INTERNAL_TOKEN:?set DOC_INTERNAL_TOKEN}
      DOC_TENANTS: ${DOC_TENANTS:?set DOC_TENANTS JSON}
      DOC_CRON_ENABLED: "true"
      DOC_JOB_MAX_ATTEMPTS: ${DOC_JOB_MAX_ATTEMPTS:-3}
      DOC_EXPORT_RETENTION_DAYS: ${DOC_EXPORT_RETENTION_DAYS:-7}
      DOC_MAX_UPLOAD_BYTES: ${DOC_MAX_UPLOAD_BYTES:-20971520}
      DOC_S3_BUCKET: ${DOC_S3_BUCKET:-}
      DOC_S3_REGION: ${DOC_S3_REGION:-us-east-1}
      DOC_S3_PREFIX: ${DOC_S3_PREFIX:-doc-vector-exports}
      DOC_S3_ENDPOINT: ${DOC_S3_ENDPOINT:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - doc-data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  doc-data:
